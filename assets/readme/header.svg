<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Rahul Chitala, full-stack developer">
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08"/></pattern>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.75"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4f46e5" stop-opacity="0.55"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c026d3" stop-opacity="0.35"/><stop offset="1" stop-color="#c026d3" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#09080f"/>
    <circle cx="930" cy="110" r="360" fill="url(#b1)"/>
    <circle cx="1130" cy="400" r="300" fill="url(#b2)"/>
    <circle cx="700" cy="20" r="200" fill="url(#b3)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="19.5" fill="none" stroke="rgba(167,139,250,0.20)"/>

  <text x="80" y="84" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="3.5" fill="rgba(245,243,255,0.62)">PORTFOLIO · GITHUB / BUSYBOYRAHUL</text>
  <text x="76" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-style="italic" letter-spacing="-2" fill="#f5f3ff">Rahul Chitala</text>
  <text x="82" y="262" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#a78bfa">&gt;</text>
  <text x="112" y="262" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="rgba(245,243,255,0.62)">full-stack developer</text>
  <rect x="396" y="244" width="13" height="26" fill="#a78bfa">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="82" y="312" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="rgba(245,243,255,0.62)">CRMs · SaaS products · AI automation · the servers they run on</text>

  <g>
    <rect x="800" y="116" width="310" height="176" rx="14" fill="#09080f" fill-opacity="0.55" stroke="rgba(255,255,255,0.16)"/>
    <circle cx="824" cy="138" r="5" fill="#ff5f57" fill-opacity="0.8"/><circle cx="842" cy="138" r="5" fill="#febc2e" fill-opacity="0.8"/><circle cx="860" cy="138" r="5" fill="#28c840" fill-opacity="0.8"/>
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text x="824" y="174" fill="#a78bfa">const <tspan fill="#f5f3ff">rahul</tspan> <tspan fill="rgba(245,243,255,0.62)">= {</tspan></text>
      <text x="844" y="197" fill="#a78bfa">role<tspan fill="rgba(245,243,255,0.62)">:</tspan> <tspan fill="#e9d5ff">"Full-Stack"</tspan><tspan fill="rgba(245,243,255,0.62)">,</tspan></text>
      <text x="844" y="220" fill="#a78bfa">stack<tspan fill="rgba(245,243,255,0.62)">:</tspan> <tspan fill="#e9d5ff">"PHP + MySQL"</tspan><tspan fill="rgba(245,243,255,0.62)">,</tspan></text>
      <text x="844" y="243" fill="#a78bfa">focus<tspan fill="rgba(245,243,255,0.62)">:</tspan> <tspan fill="#e9d5ff">"CRM · SaaS · AI"</tspan><tspan fill="rgba(245,243,255,0.62)">,</tspan></text>
      <text x="844" y="266" fill="#a78bfa">base<tspan fill="rgba(245,243,255,0.62)">:</tspan> <tspan fill="#e9d5ff">"Hyderabad"</tspan></text>
      <text x="824" y="284" fill="rgba(245,243,255,0.62)">};</text>
    </g>
  </g>
  <text x="1120" y="372" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2.5" fill="rgba(245,243,255,0.62)">HYDERABAD · INDIA</text>
</svg>
