<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="524" viewBox="0 0 1200 524" role="img" aria-label="About: I build CRMs, SaaS products and AI automations for real businesses, from the first screen to the live server. Based in Hyderabad, India. Working at Blue Origin IT Staffing. 3+ years, 7+ major projects, 3 SaaS products, 5 disciplines.">
  <defs>
    <clipPath id="clip"><rect x="0.5" y="0.5" width="1199" height="523" rx="22"/></clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="0.4" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#f5f3ff"/><stop offset="0.6" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-500 0;900 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="524" fill="#09080f"/>
    <circle cx="1120" cy="0" r="320" fill="url(#blob)"><animateTransform attributeName="transform" type="translate" values="0 0;-140 50;0 0" dur="13s" repeatCount="indefinite"/></circle>
    <rect width="1200" height="524" fill="url(#dots)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="522.5" rx="21.5" fill="none" stroke="rgba(167,139,250,0.55)" stroke-width="1.5"/>

  <text x="40" y="44" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="2" fill="#a78bfa">01</text>
  <text x="80" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic" fill="#f5f3ff">About</text>
  <text x="1160" y="44" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="3" fill="rgba(245,243,255,0.62)">HYDERABAD · INDIA</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="rgba(255,255,255,0.11)"/>
  <rect x="40" y="66.5" width="40" height="3" rx="1.5" fill="#8b5cf6"><animate attributeName="x" values="40;1120;40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1" dur="7s" repeatCount="indefinite"/></rect>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" fill="#f5f3ff">
    <text x="40" y="144">I build <tspan fill="url(#shine)">CRMs, SaaS products</tspan></text>
    <text x="40" y="196"><tspan fill="url(#shine)">and AI automations</tspan> for real businesses,</text>
    <text x="40" y="248">from the first screen to the live server.</text>
  </g>
  <line x1="40" y1="276" x2="1160" y2="276" stroke="rgba(255,255,255,0.11)"/>
  <text x="40" y="312" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="3" fill="rgba(245,243,255,0.62)">BASED IN</text>
  <text x="40" y="344" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f5f3ff">Hyderabad, India</text>
  <text x="440" y="312" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="3" fill="rgba(245,243,255,0.62)">WORKING AT</text>
  <text x="440" y="344" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f5f3ff">Blue Origin IT Staffing</text>
  <text x="840" y="312" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="3" fill="rgba(245,243,255,0.62)">ASK ME ABOUT</text>
  <text x="840" y="344" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f5f3ff">CRMs, WhatsApp, AI agents</text>
  <line x1="40" y1="376" x2="1160" y2="376" stroke="rgba(255,255,255,0.11)"/>
  <text x="40" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" fill="#f5f3ff">3+</text>
  <text x="40" y="472" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="rgba(245,243,255,0.62)">years building client</text>
  <text x="40" y="491" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="rgba(245,243,255,0.62)">websites, CRMs and SaaS</text>
  <line x1="320" y1="392" x2="320" y2="496" stroke="rgba(255,255,255,0.11)"/>
  <text x="348" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" fill="#f5f3ff">7+</text>
  <text x="348" y="472" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="rgba(245,243,255,0.62)">major projects shipped</text>
  <text x="348" y="491" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="rgba(245,243,255,0.62)">across 4 business verticals</text>
  <line x1="600" y1="392" x2="600" y2="496" stroke="rgba(255,255,255,0.11)"/>
  <text x="628" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" fill="#f5f3ff">3</text>
  <text x="628" y="472" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="rgba(245,243,255,0.62)">SaaS products built:</text>
  <text x="628" y="491" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="rgba(245,243,255,0.62)">CRM, marketing and finance</text>
  <line x1="880" y1="392" x2="880" y2="496" stroke="rgba(255,255,255,0.11)"/>
  <text x="908" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" fill="#f5f3ff">5</text>
  <text x="908" y="472" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="rgba(245,243,255,0.62)">disciplines handled,</text>
  <text x="908" y="491" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="rgba(245,243,255,0.62)">design to live server</text>
