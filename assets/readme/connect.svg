<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Connect: Let's build something good. Have a website, CRM, SaaS or automation idea? I'll plan it, build it, deploy it and keep it running.">
  <defs>
    <clipPath id="frame"><path d="M0 0H1200V520a20 20 0 0 1-20 20H20a20 20 0 0 1-20-20Z"/></clipPath>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="540"><stop offset="0" stop-color="#4c1d95"/><stop offset="0.55" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0">
      <stop offset="0" stop-color="#fbcfe8"/><stop offset="0.4" stop-color="#fbcfe8"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="0.6" stop-color="#fbcfe8"/><stop offset="1" stop-color="#fbcfe8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-400 0;700 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)"><rect width="1200" height="540" fill="url(#bg)"/>
    <circle cx="960" cy="110" r="250" fill="url(#orb)"><animateTransform attributeName="transform" type="translate" values="0 0;-160 50;0 0" dur="12s" repeatCount="indefinite"/></circle></g>
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="rgba(255,255,255,0.35)"/>
  <text x="40" y="46" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="4" fill="rgba(255,255,255,0.8)">05 · CONNECT</text>
  <g opacity="0"><text x="40" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-style="italic" fill="#ffffff">Let's build something</text><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 22" to="0 0" begin="0.3s" dur="0.5s" fill="freeze"/></g>
  <g opacity="0"><text x="40" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-style="italic" fill="url(#shine)">good.</text><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 22" to="0 0" begin="0.7s" dur="0.5s" fill="freeze"/></g>
  <g opacity="0"><text x="40" y="352" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="rgba(255,255,255,0.88)">Have a website, CRM, SaaS or automation idea? I'll plan it, build it, deploy it and keep it running.</text><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="1.2s" dur="0.5s" fill="freeze"/></g>
</svg>
